[workspace]

[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
wasi = "0.14.2"
tokio-util = { version = "0.7.13", features = ["codec"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
wasmtime = { version = "30.0.2", features = ["component-model"] }
wasmtime-wasi = "30.0.2"
tokio = { version = "1.44.0", features = ["full"] }
cap-net-ext = "3.4.2"
